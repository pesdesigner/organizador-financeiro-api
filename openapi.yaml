openapi: 3.0.3

info:
  title: Organizador Financeiro API
  description: API do Organizador Financeiro Pessoal
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Desenvolvimento local

paths:
  /api/health:
    get:
      summary: Verifica a disponibilidade da API e do MongoDB
      responses:
        "200":
          description: API disponível e conectada ao MongoDB
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: organizador-financeiro-api
                  database:
                    type: string
                    example: connected
        "503":
          description: API sem conexão com o MongoDB
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Database unavailable